<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FenPei · 服务端控制台</title><link rel="stylesheet" href="/assets/server/style.css"><link rel="stylesheet" href="/assets/workspace/update.css"></head>
<body><aside class="sidebar"><a class="logo" href="/server">FenPei<span>服务端控制台</span></a><nav aria-label="服务端导航"><button data-view="overview" class="selected">运行总览</button><button data-view="pool">数据池管理</button><button data-view="workers">客户端监控</button><button data-view="events">运行记录</button></nav><div class="sidebar-foot"><span id="account"></span><button id="logout">退出登录</button></div></aside><main><header><div><h1 id="pageTitle">运行总览</h1></div><div class="connection"><span id="connection">正在连接…</span><button id="refresh">刷新</button></div></header>
<section id="appUpdate" class="app-update" aria-label="应用更新"></section>
<p id="error" class="error" role="status" hidden></p>
<section class="dispatch"><div><strong id="dispatchState">正在获取分发状态</strong><p id="dispatchHint">查看任务池、分发进度和连接设备。</p></div><button id="pause" disabled>暂停分发</button></section><section class="metrics" data-section="overview" aria-label="运行概况"><article><span>池子里的数据</span><strong id="total">—</strong><small id="volume">文件夹</small></article><article><span>排队等待</span><strong id="waiting">—</strong><small>客户端</small></article><article><span>正在工作</span><strong id="working">—</strong><small>客户端</small></article><article><span>已连接</span><strong id="connected">—</strong><small>客户端 · 按最近心跳判断</small></article></section>
<div class="live" data-section="overview workers"><section class="panel"><div class="heading"><h2>任务执行监控</h2><span id="workCount"></span></div><div id="workList"><p class="empty">正在获取任务状态…</p></div></section><section class="panel"><div class="heading"><h2>已连接客户端</h2><span id="clientCount"></span></div><div id="clientList"><p class="empty">正在获取连接状态…</p></div></section></div>
<section class="panel" data-section="pool"><div class="heading"><h2>数据池</h2><input id="search" type="search" placeholder="搜索文件夹或硬盘" aria-label="搜索数据池"></div><p id="poolInfo" class="muted"></p>
<details open><summary>加入硬盘数据</summary><form id="sourceForm"><label for="sourcePath">源电脑上已挂载的目录</label><div class="source-input"><input id="sourcePath" required placeholder="/media/用户名/硬盘名称"><button id="browse" type="button">选择文件夹</button><button id="scan">扫描目录</button></div></form><p id="sourceMessage" role="status" class="muted">目录下的一级子文件夹会作为任务加入池子。</p><button id="add" hidden>加入数据池</button></details>
<div class="table-wrap"><table><thead><tr><th>文件夹</th><th>来源硬盘 / 目录</th><th>文件数</th><th>大小</th><th>状态</th><th>操作</th></tr></thead><tbody id="poolRows"></tbody></table></div><p id="poolEmpty" class="empty" hidden>池子里暂无数据，可通过上方入口加入硬盘目录。</p><div id="pages" class="pages" hidden><button id="prev">上一页</button><span id="pageInfo"></span><button id="next">下一页</button></div></section>
<dialog id="directoryDialog" aria-labelledby="directoryTitle"><div class="heading"><h2 id="directoryTitle">选择源电脑上的文件夹</h2><button id="closeDirectory" type="button" aria-label="关闭文件夹选择">关闭</button></div><div id="directoryShortcuts" class="directory-shortcuts"></div><div class="directory-location"><button id="directoryUp" type="button">上一级</button><strong id="directoryPath"></strong></div><p id="directoryError" role="status" class="muted"></p><div id="directoryList" class="directory-list"></div><div class="directory-footer"><small>选择包含任务子文件夹的目录</small><button id="chooseDirectory" type="button">选择当前文件夹</button></div></dialog>
<section class="panel" data-section="events" hidden><div class="heading"><h2>运行记录</h2><span>最近 200 条 · 本次服务运行期间</span></div><div id="eventList"></div></section><footer><span id="version"></span><span>每 2 秒刷新服务端状态</span></footer></main><script type="module" src="/assets/server/app.js"></script></body></html>
